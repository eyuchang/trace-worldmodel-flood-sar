name: Reference validation-v2 recovery governance

on:
  push:
    branches:
      - demo-delta-reference-scenario
    paths:
      - ".github/workflows/reference-base-validation-v2-recovery.yml"
      - ".github/workflows/reference-validation-recovery-governance.yml"
      - "data/scenario/delta/reference_recovery/**"
      - "docs/delta/reference/recovery/**"
      - "recovery_tests/reference/**"
      - "scripts/reference/run_base_validation_recovery_v1.py"
      - "src/trace_reference_recovery/**"
  pull_request:
    paths:
      - ".github/workflows/reference-base-validation-v2-recovery.yml"
      - ".github/workflows/reference-validation-recovery-governance.yml"
      - "data/scenario/delta/reference_recovery/**"
      - "docs/delta/reference/recovery/**"
      - "recovery_tests/reference/**"
      - "scripts/reference/run_base_validation_recovery_v1.py"
      - "src/trace_reference_recovery/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out recovery governance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the exact Reference environment
        run: |
          python -m pip install --require-hashes -r requirements-delta-python311.lock
          python -m pip install -e . --no-deps

      - name: Verify recovery governance without protected derivation
        run: |
          python -m pytest -q recovery_tests/reference
          ruff check src/trace_reference_recovery scripts/reference/run_base_validation_recovery_v1.py recovery_tests/reference
          ruff format --check src/trace_reference_recovery scripts/reference/run_base_validation_recovery_v1.py recovery_tests/reference
          mypy --strict src/trace_reference_recovery scripts/reference/run_base_validation_recovery_v1.py
          python scripts/reference/run_base_validation_recovery_v1.py \
            --repository-root . verify-manifest

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
