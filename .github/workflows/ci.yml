name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python@sha256:88b6d3132a0850db3587a4f4ff28d5568e7d65ff99f0ee34f42be864ddb4ca1d
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-delta-python311.lock
          python -m pip install -e . --no-deps
      - name: Verify exact Delta reference environment
        run: >-
          python scripts/verify_delta_reference_environment.py
          --contract data/scenario/delta/environment/python311_linux_amd64_v1.json
          --lock requirements-delta-python311.lock
          --require-match
      - name: Lint
        run: >-
          python -m ruff check
          scripts/build_delta_predictor_fixtures.py
          scripts/build_delta_small_geography.py
          scripts/calibrate_delta_v7_truth.py
          scripts/calibrate_delta_v8.py
          scripts/check_delta_coverage.py
          scripts/download_vjepa.py
          scripts/measure_delta_performance.py
          scripts/run_delta_vjepa_offline.py
          scripts/run_ci_test_shard.py
          scripts/select_delta_v8_reconciliation.py
          scripts/verify_delta_refactor_equivalence.py
          scripts/verify_delta_reference_environment.py
          scripts/reference/verify_delivery_history.py
          scripts/write_delta_scientific_manifest.py
          src/trace_jepa/contracts/models.py
          src/trace_jepa/controller.py
          src/trace_jepa/experimental/revalidation.py
          src/trace_jepa/predictor
          src/trace_jepa/scenario/delta
          src/trace_jepa/support
          src/trace_reference
          tests/delta
          tests/predictor
          tests/test_experimental_profile_provenance.py
          tests/test_revalidation_guard.py
      - name: Verify formatting
        run: >-
          python -m ruff format --check
          scripts/build_delta_predictor_fixtures.py
          scripts/build_delta_small_geography.py
          scripts/calibrate_delta_v7_truth.py
          scripts/calibrate_delta_v8.py
          scripts/check_delta_coverage.py
          scripts/download_vjepa.py
          scripts/measure_delta_performance.py
          scripts/run_delta_vjepa_offline.py
          scripts/run_ci_test_shard.py
          scripts/select_delta_v8_reconciliation.py
          scripts/verify_delta_refactor_equivalence.py
          scripts/verify_delta_reference_environment.py
          scripts/reference/verify_delivery_history.py
          scripts/write_delta_scientific_manifest.py
          src/trace_jepa/experimental/revalidation.py
          src/trace_jepa/predictor
          src/trace_jepa/scenario/delta
          src/trace_jepa/support
          src/trace_reference
          tests/delta
          tests/predictor
      - name: Type-check Delta and predictor seams
        run: >-
          python -m mypy
          src/trace_jepa/scenario/delta
          src/trace_jepa/predictor
          src/trace_reference
          src/trace_jepa/experimental/revalidation.py
          src/trace_jepa/support
      - name: Verify complete disjoint test-shard registry
        run: >-
          python scripts/run_ci_test_shard.py
          --repository-root .
          --registry data/scenario/delta/reference_protocol/reference_ci_test_shards_v1.json
          --verify

  test-shards:
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python@sha256:88b6d3132a0850db3587a4f4ff28d5568e7d65ff99f0ee34f42be864ddb4ca1d
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - delta-small
          - predictor-governance
          - workbench-legacy
          - reference-domain
          - reference-pipeline
          - reference-g3-characterization
          - reference-g3-execution
          - reference-g3-integrity
          - reference-mission-basic
          - reference-mission-outcomes
          - reference-mission-faults
          - reference-mission-restart
          - reference-provenance
          - reference-phase6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-delta-python311.lock
          python -m pip install -e . --no-deps
      - name: Run registered test shard with branch coverage
        run: |
          mkdir -p coverage-parts
          python scripts/run_ci_test_shard.py \
            --repository-root . \
            --registry data/scenario/delta/reference_protocol/reference_ci_test_shards_v1.json \
            --shard "${{ matrix.shard }}" \
            --coverage-output "coverage-parts/.coverage.${{ matrix.shard }}"
      - name: Upload branch-coverage fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delta-coverage-${{ matrix.shard }}
          path: coverage-parts/.coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    needs: test-shards
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python@sha256:88b6d3132a0850db3587a4f4ff28d5568e7d65ff99f0ee34f42be864ddb4ca1d
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-delta-python311.lock
          python -m pip install -e . --no-deps
      - name: Download every branch-coverage fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: delta-coverage-*
          path: coverage-parts
          merge-multiple: true
      - name: Merge and enforce high-consequence Task 1/2 coverage
        run: |
          python -m coverage combine coverage-parts
          python -m coverage json -o coverage-delta.json
          python scripts/check_delta_coverage.py coverage-delta.json

  post-test:
    needs:
      - quality
      - coverage
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python@sha256:88b6d3132a0850db3587a4f4ff28d5568e7d65ff99f0ee34f42be864ddb4ca1d
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-delta-python311.lock
          python -m pip install -e . --no-deps
      - name: Verify exact Delta reference environment
        run: >-
          python scripts/verify_delta_reference_environment.py
          --contract data/scenario/delta/environment/python311_linux_amd64_v1.json
          --lock requirements-delta-python311.lock
          --require-match
      - name: Verify the complete Delta scientific input freeze
        run: >-
          python -c "from pathlib import Path;
          from trace_jepa.scenario.delta.scientific_manifest import verify_scientific_input_manifest;
          verify_scientific_input_manifest(Path('.'),
          Path('data/scenario/delta/provenance/v8_scientific_input_manifest_v3.json'))"
      - name: Verify committed Delta book v6 when published
        shell: bash
        run: |
          if [[ -d data/scenario/delta/reference/wf_dfld_01_small_book_v6 ]]; then
            trace-jepa-delta-small replay \
              --reference data/scenario/delta/reference/wf_dfld_01_small_book_v6 \
              --validation-report docs/delta/validation/WF_DFLD_01_SMALL_VALIDATION_V6.json \
              --output "${RUNNER_TEMP}/delta-book-v6-replay"
          fi
      - name: Reject whitespace errors across the complete branch diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          base="$(git merge-base HEAD origin/main)"
          git diff --check "${base}..HEAD"
          git diff --check
