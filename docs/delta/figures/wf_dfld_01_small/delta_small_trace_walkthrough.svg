<text x="45.0" y="395.0" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17202a">Truth IDs and person IDs never cross the hidden/public boundary.</text>
<text x="45.0" y="425.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17202a">Repairs use shared callback tokens, report revisions, and spatial/temporal similarity.</text>
