<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"
     viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TRACE-JEPA operational cast</title>
  <desc id="desc">TRACE-JEPA flood search-and-rescue teaching figure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .heading { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .mono { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .route-label { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="60" y="55" class="title">Operational cast: one controller, two field agents, one world</text>
<text x="60" y="85" class="subtitle">TRACE is a gate inside Mission Control, not a robot, planner, or hidden evaluator.</text>
<rect x="420" y="108" width="360" height="108" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="600.0" y="142" text-anchor="middle" class="heading">Incident Commander</text>
<text x="600.0" y="170" text-anchor="middle" class="body"><tspan x="600.0" dy="0">External human authority</tspan><tspan x="600.0" dy="20">Approves consequential dispatch classes</tspan></text>
<rect x="105" y="262" width="990" height="300" rx="22" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/>
<text x="600" y="300" text-anchor="middle" class="heading">Mission Controller</text>
<text x="600" y="325" text-anchor="middle" class="small">One central program at the command post</text>
<rect x="135" y="365" width="160" height="145" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="215.0" y="399" text-anchor="middle" class="label">Mission State</text>
<text x="215.0" y="427" text-anchor="middle" class="body"><tspan x="215.0" dy="0">Reported knowledge</tspan><tspan x="215.0" dy="20">No hidden truth</tspan></text>
<rect x="325" y="365" width="160" height="145" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="405.0" y="399" text-anchor="middle" class="label">Planner</text>
<text x="405.0" y="427" text-anchor="middle" class="body"><tspan x="405.0" dy="0">Proposes grounded</tspan><tspan x="405.0" dy="20">candidate actions</tspan></text>
<rect x="515" y="365" width="160" height="145" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="595.0" y="399" text-anchor="middle" class="label">World Model</text>
<text x="595.0" y="427" text-anchor="middle" class="body"><tspan x="595.0" dy="0">Predicts candidate</tspan><tspan x="595.0" dy="20">consequences</tspan></text>
<rect x="705" y="365" width="160" height="145" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="785.0" y="399" text-anchor="middle" class="label">TRACE Gate</text>
<text x="785.0" y="427" text-anchor="middle" class="body"><tspan x="785.0" dy="0">Checks whether</tspan><tspan x="785.0" dy="20">recorded evidence may</tspan><tspan x="785.0" dy="20">authorize action</tspan></text>
<rect x="895" y="365" width="160" height="145" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="975.0" y="399" text-anchor="middle" class="label">Dispatcher</text>
<text x="975.0" y="427" text-anchor="middle" class="body"><tspan x="975.0" dy="0">Sends only</tspan><tspan x="975.0" dy="20">cleared commands</tspan></text>
<rect x="55" y="620" width="260" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="185.0" y="654" text-anchor="middle" class="heading">Survey Drone</text>
<text x="185.0" y="682" text-anchor="middle" class="body"><tspan x="185.0" dy="0">Observes a requested route</tspan><tspan x="185.0" dy="20">Reports imagery and telemetry</tspan></text>
<rect x="470" y="620" width="260" height="105" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="600.0" y="654" text-anchor="middle" class="heading">Flood Environment</text>
<text x="600.0" y="682" text-anchor="middle" class="body"><tspan x="600.0" dy="0">Owns hidden route status</tspan><tspan x="600.0" dy="20">Produces observations and outcomes</tspan></text>
<rect x="885" y="620" width="260" height="105" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1015.0" y="654" text-anchor="middle" class="heading">Rescue Boat</text>
<text x="1015.0" y="682" text-anchor="middle" class="body"><tspan x="1015.0" dy="0">Executes an authorized route</tspan><tspan x="1015.0" dy="20">Transports stranded residents</tspan></text>
<rect x="950" y="112" width="200" height="108" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<text x="1050" y="145" text-anchor="middle" class="label">Offline Evaluation</text>
<text x="1050" y="173" text-anchor="middle" class="small"><tspan x="1050" dy="0">Reads logs and hidden truth</tspan><tspan x="1050" dy="20">only after the episode</tspan></text>
<line x1="600" y1="216" x2="600" y2="260" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="615" y="242" class="small">approval</text>
<line x1="185" y1="620" x2="215" y2="562" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="245" y1="562" x2="215" y2="620" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="110" y="588" class="small">observations / commands</text>
<line x1="1015" y1="620" x2="975" y2="562" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="945" y1="562" x2="985" y2="620" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="900" y="588" class="small">telemetry / commands</text>
<line x1="470" y1="676" x2="315" y2="676" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="730" y1="676" x2="885" y2="676" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="600" y1="620" x2="600" y2="562" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="615" y="594" class="small">observations and outcomes</text>
<line x1="1095" y1="262" x2="1045" y2="220" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="1010" y="246" class="small">post-episode only</text>
</svg>
