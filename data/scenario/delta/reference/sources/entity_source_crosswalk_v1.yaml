entries:
  - entity_id: ISL-01
    design_name: Andrus Island
    research_status: multiple-official-records-require-spatial-crosswalk
    source_requirement_ids: [REF-SRC-01, REF-SRC-02]
    official_identifiers: [RD 317 Lower Andrus Island, RD 407 Andrus Island, RD 556 Upper Andrus Island]
    official_point: null
    evidence_locators:
      - https://www.waterboards.ca.gov/water_issues/programs/delta_watermaster/delta_map/
      - https://landuse.saccounty.gov/gp/sa/
      - https://waterresources.saccounty.gov/us/en/stormready/hazards/mitigation-plan/2021.html
    binding_status: unbound
    runtime_inclusion: none
    redistribution_disposition: factual-metadata-only-no-source-bytes-committed
    findings:
      - Official records describe Lower Andrus, Andrus, and Upper Andrus as separate reclamation districts rather than one island-wide district.
      - The Brannan-Andrus Levee Maintenance District annex associates RDs 317, 407, and 2067 with the combined maintenance district.
      - The specification's RD 407 west-levee segment requires a spatial segment-to-district crosswalk before it can be represented as fact.
