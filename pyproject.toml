[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-worldmodel-flood-sar"
version = "0.5.0"
description = "TRACE-WorldModel Flood-SAR: an auditable world-model workbench for flood search-and-rescue"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TRACE-WorldModel teaching project"}]
dependencies = [
  "numpy>=1.26,<2.3",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.17",
  "types-PyYAML>=6.0",
  "httpx>=0.27",
]
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "networkx>=3.3",
]
geography = [
  "httpx>=0.27",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "shapely>=2.1",
]
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
]
jepa = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "einops>=0.8",
  "opencv-python-headless>=4.10",
]
viz = []
all = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
  "networkx>=3.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "einops>=0.8",
  "opencv-python-headless>=4.10",
]

[project.scripts]
trace-jepa-demo = "trace_jepa.demo:main"
trace-jepa-call = "trace_jepa.emergency_cli:main"
trace-jepa-download = "trace_jepa.perception.download:main"
trace-jepa-verify = "trace_jepa.verify:main"
trace-jepa-visualize = "trace_jepa.scenario.visualize:main"
trace-jepa-render = "trace_jepa.scenario.visualize:main"
trace-jepa-ui = "trace_jepa.workbench.cli:main"
trace-jepa-dynamic-demo = "trace_jepa.workbench.demo:main"
trace-jepa-build-geography = "trace_jepa.workbench.geography_builder:main"
trace-jepa-d04 = "trace_jepa.workbench.d04_server:main"
trace-jepa-d05 = "trace_jepa.workbench.d05_server:main"
trace-jepa-delta-small = "trace_jepa.scenario.delta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"trace_jepa.workbench" = ["static/*", "d04_static/*", "d05_static/*"]
"trace_jepa.predictor" = ["*_qualification_*.json"]
