[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-worldmodel-flood-sar"
version = "0.5.0"
description = "TRACE-WorldModel Flood-SAR: an auditable world-model workbench for flood search-and-rescue"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TRACE-WorldModel teaching project"}]
dependencies = [
  "numpy>=1.26,<2.3",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=7",
  "ruff>=0.6",
  "mypy>=1.17",
  "types-PyYAML>=6.0",
  "httpx>=0.27",
]
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "networkx>=3.3",
]
geography = [
  "httpx>=0.27",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "shapely>=2.1",
]
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
]
jepa = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "einops>=0.8",
  "opencv-python-headless>=4.10",
]
viz = []
all = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
  "networkx>=3.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "einops>=0.8",
  "opencv-python-headless>=4.10",
]

[project.scripts]
trace-jepa-demo = "trace_jepa.demo:main"
trace-jepa-call = "trace_jepa.emergency_cli:main"
trace-jepa-download = "trace_jepa.perception.download:main"
trace-jepa-verify = "trace_jepa.verify:main"
trace-jepa-visualize = "trace_jepa.scenario.visualize:main"
trace-jepa-render = "trace_jepa.scenario.visualize:main"
trace-jepa-ui = "trace_jepa.workbench.cli:main"
trace-jepa-dynamic-demo = "trace_jepa.workbench.demo:main"
trace-jepa-build-geography = "trace_jepa.workbench.geography_builder:main"
trace-jepa-d04 = "trace_jepa.workbench.d04_server:main"
trace-jepa-d05 = "trace_jepa.workbench.d05_server:main"
trace-jepa-delta-small = "trace_jepa.scenario.delta.cli:main"
trace-jepa-delta-reference = "trace_reference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = [
  "B",
  "C4",
  "C90",
  "I",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Historical implementations remain readable audit evidence and are not the
# canonical Task 1/2 architecture. Compatibility facades retain old imports.
"scripts/calibrate_delta_v8.py" = ["PLR0915"]
"scripts/select_delta_v8_reconciliation.py" = ["PLR0915"]
"scripts/train_action_predictor.py" = ["PLR0915"]
"src/trace_jepa/controller.py" = ["PLR0913", "PLR0915"]
"src/trace_jepa/scenario/delta/legacy/**" = ["C90", "PLR0912", "PLR0913", "PLR0915"]
"src/trace_jepa/scenario/delta/observations_v7.py" = ["C90", "PLR0913", "PLR0915"]
"src/trace_jepa/scenario/delta/pipeline.py" = ["PLR0913"]
"src/trace_jepa/scenario/delta/truth_v7.py" = ["C4", "C90", "PLR0912", "PLR0913", "PLR0915"]
"src/trace_jepa/scenario/delta/validation_v7.py" = ["C90", "PLR0912", "PLR0913", "PLR0915"]
"tests/**" = ["PLR0913"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "trace_jepa.experimental.revalidation",
  "trace_jepa.predictor.*",
  "trace_jepa.scenario.delta.domain.*",
  "trace_jepa.scenario.delta.generation.*",
  "trace_jepa.scenario.delta.geography.*",
  "trace_jepa.scenario.delta.provenance.*",
  "trace_jepa.scenario.delta.publication.*",
  "trace_jepa.scenario.delta.reconciliation.*",
  "trace_jepa.scenario.delta.runtime.*",
  "trace_jepa.scenario.delta.validation.*",
  "trace_jepa.support.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Frozen historical implementations are retained to reproduce prior evidence;
# strict typing applies to the canonical packages and compatibility facades.
module = [
  "trace_jepa.scenario.delta.legacy.*",
  "trace_jepa.scenario.delta.observations_v7",
  "trace_jepa.scenario.delta.truth_v7",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"trace_jepa.workbench" = ["static/*", "d04_static/*", "d05_static/*"]
"trace_jepa.predictor" = ["*_qualification_*.json"]
