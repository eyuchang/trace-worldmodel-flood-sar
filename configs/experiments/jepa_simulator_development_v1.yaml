compute_amendment:
  timing: before_any_official_model_comparison_was_trained_or_inspected
  reason: >-
    The initial 64-token-frame encoding path was not viable on the available
    CPU-only host. The pinned upstream ViT-B Kinetics-400 and COIN evaluation
    configs use 16 frames with frame_step 4, which spans the same 64 source-frame
    interval with an upstream-supported temporal sample.
encoder:
  family: V-JEPA 2.1
  hub_entry: vjepa2_1_vit_base_384
  source_revision: 204698b45b3712590f06245fbfba32d3be539812
  checkpoint_sha256: 848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d
  frozen: true
  pretraining_predictor_used: false
models:
  - constant
  - structured
  - visual
  - fused
  - fused_shuffled_visual
selection:
  split: tuning
  ridge_alphas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
calibration:
  split: calibration
  method: isotonic
evaluation:
  split: validation
  primary_metrics:
    - brier
    - mse_all_targets
  secondary_metrics:
    - nll
    - ece_10
    - auroc
    - average_precision
  uncertainty: paired_episode_cluster_bootstrap_95_percent
development_interpretation_rule: >-
  Treat the visual channel as showing development-stage added value only if fused
  has a lower point estimate than structured on both primary metrics, at least one
  paired 95 percent interval excludes zero in the favorable direction, and the
  fused result also improves over shuffled-visual control on that metric.
development_gate_failure_state: heldout_test_closed
claim_boundary: >-
  This campaign can establish synchronized prototype integration, provenance,
  leakage resistance, and simulator-channel sensitivity. It cannot establish
  field-video generalization, operational safety, or cross-domain superiority.
