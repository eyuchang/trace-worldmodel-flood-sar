registration_erratum: >-
  Acceptance v9, scientific manifest v2, and both executed workflows remain
  immutable protocol history. Original run 31286349320 completed all registered
  seed evaluations but lost its ephemeral report after replay omitted the bound
  validation input. Recovery run 31289293944 completed all 200 registered seed
  evaluations, the book run, byte-identical replay, and publication generation,
  but host-side artifact upload could not read a container-root-owned hidden
  lineage file. GitHub retained zero artifacts. Neither run is rerun or relabeled.
  Protocol v10 authorizes at most one deterministic artifact-reconstruction
  replication using unchanged scientific mechanics and the already-consumed
  confirmatory-v8 seeds. It is explicitly not original, recovery, or untouched
  confirmatory evidence.
