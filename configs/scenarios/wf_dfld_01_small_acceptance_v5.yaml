registration_erratum: >-
  Acceptance v8 and confirmatory-v7 remain immutable but were superseded before
  execution because their original workflow could not be authorized from an
  unmerged feature branch and their scientific-input freeze was incomplete.
  Confirmatory-v8 is the only registered holdout for protocol v9. The first
  local v9 registration commit was superseded before execution after branch CI
  demonstrated that root-owned workflow containers require an explicit trusted
  checkout declaration. The seed list is unchanged and has never been executed.
