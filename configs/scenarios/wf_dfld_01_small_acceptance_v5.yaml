protocol_amendment: >-
  Protocol v9 preserves generator-v8 truth, observations, resources, and
  reconciliation while introducing tag-authorized once-only original execution,
  a complete scientific-input inventory, finite-only load metric labels, exact
  original-report identity, trusted artifact roots, and professional package
  boundaries. No coefficient, seed, resource, or reconciliation threshold was
  retuned for this registration. The tagged workflow declares its mounted
  checkout as safe before any Git-bound provenance check and verifies the remote
  annotated tag object rather than trusting checkout's rewritten local tag ref.
  The post-original amendment passes the registered validation report explicitly
  into replay, uploads partial evidence even after a later failure, and binds the
  recovery replication to failed original run 31286349320. It changes no seed,
  coefficient, simulator mechanism, reconciliation threshold, resource, or gate.
