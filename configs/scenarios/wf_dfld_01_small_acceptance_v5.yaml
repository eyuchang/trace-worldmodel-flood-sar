registration_erratum: >-
  Acceptance v8 and confirmatory-v7 remain immutable but were superseded before
  execution because their original workflow could not be authorized from an
  unmerged feature branch and their scientific-input freeze was incomplete.
  Confirmatory-v8 is the only registered holdout for protocol v9. The first
  local v9 registration commit was superseded before execution after branch CI
  demonstrated that root-owned workflow containers require an explicit trusted
  checkout declaration. The first authorization tag triggered GitHub Actions
  run 31285710374, which failed in authorization preflight because checkout
  replaced the local annotated-tag reference with its peeled commit. The study,
  book, replay, and publication steps were skipped. The second authorization tag
  wf-dfld-01-small-confirmatory-v8-original-r2 triggered run 31286349320. That
  run completed all 100 development and 100 confirmatory seed evaluations and
  generated its report and book bundle, then failed because replay omitted the
  explicitly bound validation-report input. Artifact upload was skipped, so the
  ephemeral report was not retained. The original run is immutable adverse
  evidence and is not rerun. A separately authorized recovery replication uses
  the unchanged seed list and scientific mechanics, is labeled as a replication,
  and cannot restore untouched-holdout status.
