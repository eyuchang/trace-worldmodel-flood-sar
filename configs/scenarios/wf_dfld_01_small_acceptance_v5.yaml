protocol_amendment: >-
  Protocol v9 preserves generator-v8 truth, observations, resources, and
  reconciliation while introducing tag-authorized once-only original execution,
  a complete scientific-input inventory, finite-only load metric labels, exact
  original-report identity, trusted artifact roots, and professional package
  boundaries. No coefficient, seed, resource, or reconciliation threshold was
  retuned for this registration. The tagged workflow declares its mounted
  checkout as safe before any Git-bound provenance check.
