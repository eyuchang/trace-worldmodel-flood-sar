protocol_amendment: >-
  Confirmatory-v1 was executed in full and retained after its median peak ratio
  of 2.5 failed the registered [1.4, 1.6] band. Initial-response service durations
  were then calibrated only on the declared development seeds. Confirmatory-v2
  met the ratio and total-volume criteria, but audit found that the realized
  ensemble hourly means peaked near 9.5 rather than the configured expected peak
  intensity of 12 and that capacity used intersecting capabilities rather than
  maximum coverable service units. Those v2 results are retained as secondary
  adverse evidence. Confirmatory-v3 was registered before the generator-v4 hourly
  observation calibration and deterministic compatibility-matching corrections.
  Confirmatory-v3 then failed the ratio gate at 3.0. A subsequent spatial QA
  test found one seeded structure inside the Census Isleton polygon but outside
  the Sacramento County Andrus footprint. Confirmatory-v4 was registered before
  correcting placement to the intersection predicate; all earlier results remain.
